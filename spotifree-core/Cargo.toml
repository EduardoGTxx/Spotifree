[workspace]
resolver = "2"
members = [
    "spotifree-core-ffi",
    "spotifree-core-network",
    "spotifree-core-storage",
    "spotifree-core-audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Spotifree Team"]
license = "GPL-3.0"

[workspace.dependencies]
uniffi = { version = "0.28.3", default-features = false, features = ["tokio"] }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
