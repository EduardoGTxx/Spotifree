name: Release Android

# Publica una versión: crea y sube un tag (git tag v2.0.1 && git push origin v2.0.1)
# o lánzalo a mano desde Actions › Release Android › Run workflow.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la versión (vX.Y.Z). Se crea si no existe."
        required: true
        default: "v2.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Huella SHA-256 del certificado con el que se firmaron todas las versiones de Spotifree.
  # Si el APK sale firmado con otra llave, Android no lo instalaría encima: el release se detiene.
  EXPECTED_CERT_SHA256: 808b604ebc15a06b63ef72ab57456851d496c4350263f7862b659cdd98f01291

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versión desde el tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::El tag debe tener la forma vX.Y.Z (recibido: $TAG)"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          # versionCode siempre creciente y derivado del tag: v2.0.1 -> 20001
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versión $MAJOR.$MINOR.$PATCH (versionCode $CODE)"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Llave de firma (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.SPOTIFREE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto SPOTIFREE_KEYSTORE_BASE64 (Settings › Secrets and variables › Actions)."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spotifree.keystore"
          echo "SPOTIFREE_KEYSTORE_FILE=$RUNNER_TEMP/spotifree.keystore" >> "$GITHUB_ENV"

      - name: Pruebas unitarias
        working-directory: spotifree-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Compilar APK firmado
        working-directory: spotifree-android
        env:
          SPOTIFREE_KEYSTORE_PASSWORD: ${{ secrets.SPOTIFREE_KEYSTORE_PASSWORD }}
          SPOTIFREE_KEY_ALIAS: ${{ secrets.SPOTIFREE_KEY_ALIAS }}
          SPOTIFREE_KEY_PASSWORD: ${{ secrets.SPOTIFREE_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verificar la firma
        run: |
          APK=spotifree-android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Certificado: $CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::El APK no está firmado con la llave de Spotifree ($CERT). No se publica."; exit 1
          fi

      - name: Preparar archivos del release
        id: files
        run: |
          mkdir -p out
          cp spotifree-android/app/build/outputs/apk/release/app-release.apk out/Spotifree.apk
          SHA=$(sha256sum out/Spotifree.apk | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  Spotifree.apk" > out/SHA256SUMS.txt
          (cd jam-server && zip -qr ../out/jam-server.zip . -x 'node_modules/*')
          cat > out/update-manifest.json <<JSON
          {
            "version": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "title": "Spotifree ${{ steps.version.outputs.tag }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sha256": "$SHA",
            "minAndroid": 10,
            "notes": [],
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Spotifree.apk"
          }
          JSON
          ls -lah out

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Spotifree ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            Descarga **Spotifree.apk** e instálalo, o actualiza desde Ajustes › Actualizaciones.
            Requiere Android 10 o superior. Se instala encima de la versión anterior conservando tus datos.

            SHA-256: ${{ steps.files.outputs.sha256 }}

            `jam-server.zip` es el servidor opcional de "Escuchar juntos" (ver docs/INTEGRACIONES.md).
          files: |
            out/Spotifree.apk
            out/SHA256SUMS.txt
            out/update-manifest.json
            out/jam-server.zip
