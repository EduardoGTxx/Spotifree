name: Release Android

# Publica una versión:
# - Automático al hacer push a main
# - Automático al crear y subir un tag (git tag v2.1.10 && git push origin v2.1.10)
# - Manual desde Actions › Release Android › Run workflow.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la versión (vX.Y.Z)."
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_CERT_SHA256: 808b604ebc15a06b63ef72ab57456851d496c4350263f7862b659cdd98f01291

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip-release]') && !contains(github.event.head_commit.message, '[skip-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar versión
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            if [ -f "spotifree-android/version.properties" ]; then
              V_NAME=$(grep '^versionName=' spotifree-android/version.properties | cut -d= -f2 | tr -d '\r\n ')
              if [ -n "$V_NAME" ]; then
                TAG="v$V_NAME"
              fi
            fi
          fi

          git fetch --tags --force
          if [ -n "$TAG" ] && git rev-parse "$TAG" >/dev/null 2>&1 && [ "${{ github.ref_name }}" = "main" ]; then
            LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)
            if [ -n "$LATEST_TAG" ] && [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJ=${BASH_REMATCH[1]}; MIN=${BASH_REMATCH[2]}; PAT=${BASH_REMATCH[3]}
              NEXT_PAT=$((PAT + 1))
              TAG="v${MAJ}.${MIN}.${NEXT_PAT}"
              echo "Tag existente detectado. Incrementando a $TAG para release automático."
            fi
          fi

          if [ -z "$TAG" ]; then
            TAG="v2.1.10"
          fi

          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::El tag debe tener la forma vX.Y.Z (recibido: $TAG)"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versión $MAJOR.$MINOR.$PATCH (versionCode $CODE, tag $TAG)"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Compilar y Testear Rust Core
        run: |
          cd spotifree-core
          cargo test
          cargo build -p spotifree-core-ffi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Llave de firma (GitHub Secrets o repositorio)
        env:
          KEYSTORE_BASE64: ${{ secrets.SPOTIFREE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spotifree.keystore"
            echo "SPOTIFREE_KEYSTORE_FILE=$RUNNER_TEMP/spotifree.keystore" >> "$GITHUB_ENV"
          elif [ -f "spotifree-android/app/spotifree.keystore" ]; then
            echo "SPOTIFREE_KEYSTORE_FILE=app/spotifree.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::No se encontró spotifree.keystore ni el secreto SPOTIFREE_KEYSTORE_BASE64."; exit 1
          fi

      - name: Pruebas unitarias
        working-directory: spotifree-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Compilar APK firmado
        working-directory: spotifree-android
        env:
          SPOTIFREE_KEYSTORE_PASSWORD: ${{ secrets.SPOTIFREE_KEYSTORE_PASSWORD || 'spotifree' }}
          SPOTIFREE_KEY_ALIAS: ${{ secrets.SPOTIFREE_KEY_ALIAS || 'spotifree' }}
          SPOTIFREE_KEY_PASSWORD: ${{ secrets.SPOTIFREE_KEY_PASSWORD || 'spotifree' }}
        run: >
          ./gradlew assembleRelease --no-daemon
          "-PappVersionName=${{ steps.version.outputs.name }}"
          "-PappVersionCode=${{ steps.version.outputs.code }}"

      - name: Verificar la firma
        run: |
          APK=spotifree-android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Certificado: $CERT"
          EXPECTED="${{ secrets.SPOTIFREE_EXPECTED_CERT || env.EXPECTED_CERT_SHA256 }}"
          if [ -n "$EXPECTED" ] && [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::El APK no está firmado con la llave esperada ($CERT vs $EXPECTED). No se publica."; exit 1
          fi

      - name: Preparar archivos del release
        id: files
        run: |
          mkdir -p out
          cp spotifree-android/app/build/outputs/apk/release/app-release.apk out/Spotifree.apk
          SHA=$(sha256sum out/Spotifree.apk | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  Spotifree.apk" > out/SHA256SUMS.txt
          (cd jam-server && zip -qr ../out/jam-server.zip . -x 'node_modules/*')
          cat > out/update-manifest.json <<JSON
          {
            "version": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "title": "Spotifree ${{ steps.version.outputs.tag }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sha256": "$SHA",
            "minAndroid": 10,
            "notes": [],
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Spotifree.apk"
          }
          JSON
          ls -lah out

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Spotifree ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            Descarga **Spotifree.apk** e instálalo, o actualiza automáticamente desde la app al entrar.
            Requiere Android 10 o superior. Se instala encima de la versión anterior conservando tus datos.

            SHA-256: ${{ steps.files.outputs.sha256 }}

            `jam-server.zip` es el servidor opcional de "Escuchar juntos" (ver docs/INTEGRACIONES.md).
          files: |
            out/Spotifree.apk
            out/SHA256SUMS.txt
            out/update-manifest.json
            out/jam-server.zip
